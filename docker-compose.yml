services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-interlinked-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interlinkedlog}
      MYSQL_USER: ${MYSQL_USER:-interlinked}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-interlinked}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:3000
      APP_KEY: ${APP_KEY:-base64:RznMgFB/a8l7NtPJYyrrQ9P6/YyWUfLFZ9BKjyyHZR8=}
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-interlinkedlog}
      DB_USERNAME: ${MYSQL_USER:-interlinked}
      DB_PASSWORD: ${MYSQL_PASSWORD:-interlinked}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: curl -sf http://localhost:8000/up || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  test:
    build:
      context: ./backend
      target: dev
    profiles: ["test"]
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:-base64:RznMgFB/a8l7NtPJYyrrQ9P6/YyWUfLFZ9BKjyyHZR8=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: interlinkedlog_test
      DB_USERNAME: ${MYSQL_USER:-interlinked}
      DB_PASSWORD: ${MYSQL_PASSWORD:-interlinked}
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "touch .env && php artisan test"

  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8000
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16